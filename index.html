<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SUBHASH // DIGITAL UNIVERSE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010303;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================================================
   CINEMATIC OVERLAYS
========================================================= */

#cinematic{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#vignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.15) 55%,
            rgba(0,0,0,.82) 100%
        );
}

#scanlines{
    position:absolute;
    inset:0;
    opacity:.08;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );
}

#warpFlash{
    position:absolute;
    inset:-20%;
    opacity:0;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,170,.35),
            rgba(0,255,170,.08) 25%,
            transparent 65%
        );
    filter:blur(30px);
}

/* =========================================================
   TOP HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    padding:28px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:11px;
    letter-spacing:.35em;
    color:rgba(255,255,255,.72);
}

.brandDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00ffaa;
    box-shadow:
        0 0 10px #00ffaa,
        0 0 30px #00ffaa;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(.7);opacity:.45}
    50%{transform:scale(1.25);opacity:1}
}

.telemetry{
    text-align:right;
    font:10px monospace;
    line-height:1.7;
    letter-spacing:.1em;
    color:#00ffaa;
    text-shadow:0 0 12px rgba(0,255,170,.5);
}

/* =========================================================
   CENTER TARGET
========================================================= */

#reticle{
    position:fixed;
    left:50%;
    top:50%;
    width:42px;
    height:42px;
    transform:translate(-50%,-50%);
    z-index:31;
    pointer-events:none;
    transition:.2s ease;
}

#reticle:before,
#reticle:after{
    content:"";
    position:absolute;
    inset:0;
    border:1px solid rgba(0,255,170,.25);
    border-radius:50%;
}

#reticle:after{
    inset:11px;
    border-color:#00ffaa;
    box-shadow:0 0 15px #00ffaa;
}

.reticleDot{
    position:absolute;
    width:3px;
    height:3px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 10px #00ffaa;
}

/* =========================================================
   BOTTOM HUD
========================================================= */

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

.navigation{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.navItem{
    pointer-events:auto;
    cursor:pointer;
    width:max-content;
    padding:4px 10px;
    border-left:1px solid transparent;
    font-size:9px;
    letter-spacing:.22em;
    color:rgba(255,255,255,.28);
    transition:.35s ease;
}

.navItem:hover{
    color:#fff;
}

.navItem.active{
    color:#00ffaa;
    border-left-color:#00ffaa;
    text-shadow:0 0 14px rgba(0,255,170,.7);
}

.travel{
    font-size:9px;
    letter-spacing:.3em;
    color:rgba(255,255,255,.5);
    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    50%{transform:translateY(-7px)}
}

/* =========================================================
   INTRO
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:50;
    background:#010303;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:opacity 1.5s ease,visibility 1.5s;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

.introOrb{
    width:130px;
    height:130px;
    border-radius:50%;
    border:1px solid rgba(0,255,170,.5);
    box-shadow:
        0 0 50px rgba(0,255,170,.15),
        inset 0 0 50px rgba(0,255,170,.1);
    position:relative;
    animation:orb 4s infinite linear;
}

.introOrb:before,
.introOrb:after{
    content:"";
    position:absolute;
    inset:15px;
    border:1px solid rgba(0,255,170,.35);
    border-radius:50%;
}

.introOrb:after{
    inset:35px;
    background:#00ffaa;
    box-shadow:
        0 0 20px #00ffaa,
        0 0 70px #00ffaa;
}

@keyframes orb{
    to{transform:rotate(360deg)}
}

.introText{
    margin-top:38px;
    text-align:center;
}

.introText h1{
    font-size:clamp(30px,7vw,75px);
    letter-spacing:.22em;
    font-weight:800;
}

.introText p{
    margin-top:12px;
    font-size:10px;
    letter-spacing:.4em;
    color:#00ffaa;
}

.enter{
    margin-top:45px;
    padding:14px 30px;
    border:1px solid rgba(0,255,170,.4);
    background:rgba(0,255,170,.03);
    color:#fff;
    letter-spacing:.25em;
    font-size:10px;
    cursor:pointer;
    transition:.3s;
}

.enter:hover{
    background:#00ffaa;
    color:#000;
    box-shadow:0 0 40px rgba(0,255,170,.5);
}

/* =========================================================
   SECTION LABEL
========================================================= */

#sectionInfo{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:25;
    pointer-events:none;
    text-align:center;
    opacity:0;
    transition:opacity .5s;
    width:min(850px,90vw);
}

#sectionInfo.visible{
    opacity:1;
}

.sectionEyebrow{
    font-size:10px;
    letter-spacing:.5em;
    color:#00ffaa;
    margin-bottom:15px;
}

.sectionTitle{
    font-size:clamp(35px,7vw,100px);
    font-weight:900;
    letter-spacing:.08em;
    text-shadow:
        0 0 25px rgba(0,255,170,.4),
        0 0 80px rgba(0,255,170,.15);
}

.sectionDescription{
    margin:18px auto 0;
    max-width:600px;
    font-size:12px;
    line-height:1.8;
    color:rgba(255,255,255,.55);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #hud{
        padding:16px;
    }

    .brand{
        font-size:8px;
        letter-spacing:.2em;
    }

    .telemetry{
        font-size:8px;
    }

    .navigation{
        gap:4px;
    }

    .navItem{
        font-size:7px;
    }

    .travel{
        font-size:7px;
        letter-spacing:.15em;
    }

    #reticle{
        width:32px;
        height:32px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- INTRO -->
<div id="intro">

    <div class="introOrb"></div>

    <div class="introText">
        <h1>SUBHASH</h1>
        <p>DIGITAL UNIVERSE INITIALIZING</p>
    </div>

    <button class="enter" id="enter">
        ENTER THE UNIVERSE
    </button>

</div>

<!-- CINEMATIC -->
<div id="cinematic">
    <div id="warpFlash"></div>
    <div id="vignette"></div>
    <div id="scanlines"></div>
</div>

<!-- SECTION INFORMATION -->
<div id="sectionInfo">
    <div class="sectionEyebrow" id="sectionEyebrow"></div>
    <div class="sectionTitle" id="sectionTitle"></div>
    <div class="sectionDescription" id="sectionDescription"></div>
</div>

<!-- HUD -->
<div id="hud">

    <div class="top">

        <div class="brand">
            <div class="brandDot"></div>
            <span>SUBHASH // VOLUMETRIC OS</span>
        </div>

        <div class="telemetry" id="telemetry">
            SYSTEM BOOTING...
        </div>

    </div>

    <div class="bottom">

        <div class="navigation" id="navigation">

            <div class="navItem active" data-index="0">
                01 // ORIGIN
            </div>

            <div class="navItem" data-index="1">
                02 // IDENTITY
            </div>

            <div class="navItem" data-index="2">
                03 // SKILLS
            </div>

            <div class="navItem" data-index="3">
                04 // TECHNOLOGY
            </div>

            <div class="navItem" data-index="4">
                05 // PROJECTS
            </div>

            <div class="navItem" data-index="5">
                06 // FANTOVEX
            </div>

            <div class="navItem" data-index="6">
                07 // FUTURE
            </div>

        </div>

        <div class="travel">
            ◈ DRAG / SCROLL TO TRAVEL ◈
        </div>

    </div>

</div>

<div id="reticle">
    <div class="reticleDot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   SUBHASH DIGITAL UNIVERSE
   NEXT-GENERATION VOLUMETRIC ENGINE
========================================================= */

class DigitalUniverse {

    constructor(){

        this.container=document.getElementById("app");

        /* -------------------------
           CORE
        ------------------------- */

        this.scene=new THREE.Scene();

        this.scene.fog=new THREE.FogExp2(
            0x010303,
            0.000075
        );

        this.camera=new THREE.PerspectiveCamera(
            70,
            innerWidth/innerHeight,
            .1,
            60000
        );

        this.renderer=new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });

        this.renderer.setSize(innerWidth,innerHeight);

        this.renderer.setPixelRatio(
            Math.min(devicePixelRatio,1.7)
        );

        this.renderer.setClearColor(
            0x010303,
            1
        );

        this.container.appendChild(
            this.renderer.domElement
        );

        /* -------------------------
           FLIGHT PHYSICS
        ------------------------- */

        this.z=1800;
        this.targetZ=1800;

        this.velocity=0;

        this.mouse={
            x:0,
            y:0,
            tx:0,
            ty:0
        };

        this.roll=0;

        /* -------------------------
           WORLD
        ------------------------- */

        this.universe=new THREE.Group();

        this.scene.add(this.universe);

        this.stars=[];
        this.worldObjects=[];

        this.clock=new THREE.Clock();

        this.sections=[
            {
                z:1800,
                name:"ORIGIN",
                eyebrow:"SYSTEM // GENESIS",
                title:"SUBHASH",
                description:
                    "A digital space built around curiosity, technology, experimentation and the ambition to create something larger than the screen."
            },
            {
                z:-500,
                name:"IDENTITY",
                eyebrow:"PROFILE // DIGITAL BUILDER",
                title:"DIGITAL MANAGER",
                description:
                    "Strategy • technology • execution. Exploring how digital systems, AI and design can become useful real-world products."
            },
            {
                z:-3500,
                name:"SKILLS",
                eyebrow:"CAPABILITIES // ACTIVE",
                title:"SKILLS GALAXY",
                description:
                    "Web development • AI experimentation • UI systems • motion design • automation • digital strategy."
            },
            {
                z:-7000,
                name:"TECHNOLOGY",
                eyebrow:"STACK // ARCHITECTURE",
                title:"TECH CONSTELLATION",
                description:
                    "Code, interfaces, AI tools, creative systems and the constantly evolving technology stack behind the experiments."
            },
            {
                z:-10500,
                name:"PROJECTS",
                eyebrow:"LAB // CREATIONS",
                title:"PROJECT WORLDS",
                description:
                    "A collection of digital experiments, websites, assistants, interfaces and startup concepts."
            },
            {
                z:-14000,
                name:"FANTOVEX",
                eyebrow:"ESPORTS // UNIVERSE",
                title:"FANTOVEX",
                description:
                    "PLAY BEYOND LIMITS — an esports universe beginning with Free Fire and evolving toward a larger gaming ecosystem."
            },
            {
                z:-18000,
                name:"FUTURE",
                eyebrow:"NEXT // HORIZON",
                title:"BUILD WHAT'S NEXT",
                description:
                    "The universe does not end here. New projects, new systems and new worlds are continuously loading."
            }
        ];

        this.init();

    }

    /* =====================================================
       INITIALIZATION
    ===================================================== */

    init(){

        this.createAmbientSpace();

        this.createGalaxy();

        this.createNebulas();

        this.createWorlds();

        this.createWarpTunnel();

        this.createInteractiveCore();

        this.bindEvents();

        this.animate();

    }

    /* =====================================================
       STAR FIELD
    ===================================================== */

    createAmbientSpace(){

        const count=14000;

        const geo=new THREE.BufferGeometry();

        const positions=new Float32Array(count*3);

        const colors=new Float32Array(count*3);

        const sizes=new Float32Array(count);

        for(let i=0;i<count;i++){

            const radius=5000+
                Math.random()*25000;

            const theta=Math.random()*Math.PI*2;

            const phi=
                Math.acos(
                    THREE.MathUtils.randFloatSpread(2)
                );

            const x=
                Math.sin(phi)*
                Math.cos(theta)*
                radius;

            const y=
                Math.cos(phi)*
                radius;

            const z=
                Math.sin(phi)*
                Math.sin(theta)*
                radius;

            positions[i*3]=x;
            positions[i*3+1]=y;
            positions[i*3+2]=z;

            const c=new THREE.Color();

            if(Math.random()<.7){
                c.setHSL(
                    .43+
                    Math.random()*.1,
                    .8,
                    .45+
                    Math.random()*.45
                );
            }else{
                c.setRGB(1,1,1);
            }

            colors[i*3]=c.r;
            colors[i*3+1]=c.g;
            colors[i*3+2]=c.b;

            sizes[i]=
                Math.random()*3+
                1;
        }

        geo.setAttribute(
            "position",
            new THREE.BufferAttribute(
                positions,3
            )
        );

        geo.setAttribute(
            "color",
            new THREE.BufferAttribute(
                colors,3
            )
        );

        geo.setAttribute(
            "size",
            new THREE.BufferAttribute(
                sizes,1
            )
        );

        const mat=new THREE.ShaderMaterial({

            transparent:true,

            depthWrite:false,

            blending:
                THREE.AdditiveBlending,

            vertexShader:`

                attribute float size;

                varying vec3 vColor;

                void main(){

                    vColor=color;

                    vec4 mvPosition=
                        modelViewMatrix*
                        vec4(position,1.0);

                    gl_PointSize=
                        size*
                        (700.0/-mvPosition.z);

                    gl_Position=
                        projectionMatrix*
                        mvPosition;

                }

            `,

            fragmentShader:`

                varying vec3 vColor;

                void main(){

                    float d=
                        distance(
                            gl_PointCoord,
                            vec2(.5)
                        );

                    if(d>.5)
                        discard;

                    float glow=
                        pow(
                            1.0-d*2.0,
                            2.5
                        );

                    gl_FragColor=
                        vec4(
                            vColor,
                            glow
                        );

                }

            `,

            vertexColors:true

        });

        this.starField=
            new THREE.Points(
                geo,
                mat
            );

        this.universe.add(
            this.starField
        );

    }

    /* =====================================================
       GALAXY
    ===================================================== */

    createGalaxy(){

        const count=18000;

        const geo=new THREE.BufferGeometry();

        const pos=[];
        const col=[];

        for(let i=0;i<count;i++){

            const radius=
                Math.pow(Math.random(),2.1)*
                5000;

            const arms=5;

            const arm=
                i%arms;

            const angle=
                arm*
                Math.PI*2/arms+
                radius*.0017+
                (Math.random()-.5)*.5;

            const spread=
                (Math.random()-.5)*
                radius*.28;

            const x=
                Math.cos(angle)*radius+
                spread;

            const y=
                (Math.random()-.5)*
                (180+
                radius*.06);

            const z=
                -5000+
                Math.sin(angle)*radius+
                spread;

            pos.push(x,y,z);

            const color=new THREE.Color();

            const ratio=radius/5000;

            if(ratio<.2)
                color.setHex(0xffffff);

            else if(ratio<.55)
                color.setHex(0x00ffaa);

            else
                color.setHex(0x008f75);

            col.push(
                color.r,
                color.g,
                color.b
            );

        }

        geo.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(pos,3)
        );

        geo.setAttribute(
            "color",
            new THREE.Float32BufferAttribute(col,3)
        );

        const mat=new THREE.PointsMaterial({

            size:10,

            transparent:true,

            opacity:.75,

            vertexColors:true,

            blending:THREE.AdditiveBlending,

            depthWrite:false

        });

        this.galaxy=
            new THREE.Points(
                geo,
                mat
            );

        this.universe.add(
            this.galaxy
        );

    }

    /* =====================================================
       NEBULAS
    ===================================================== */

    createNebulas(){

        for(let n=0;n<18;n++){

            const group=new THREE.Group();

            group.position.set(
                THREE.MathUtils.randFloatSpread(9000),
                THREE.MathUtils.randFloatSpread(4000),
                -1000-n*1100
            );

            for(let i=0;i<90;i++){

                const geo=
                    new THREE.SphereGeometry(
                        THREE.MathUtils.randFloat(20,100),
                        8,
                        8
                    );

                const mat=
                    new THREE.MeshBasicMaterial({

                        color:
                            i%3===0
                            ?0x00ffaa
                            :0x00664f,

                        transparent:true,

                        opacity:
                            Math.random()*.035+.015,

                        blending:
                            THREE.AdditiveBlending,

                        depthWrite:false

                    });

                const cloud=
                    new THREE.Mesh(
                        geo,
                        mat
                    );

                cloud.position.set(
                    THREE.MathUtils.randFloatSpread(1500),
                    THREE.MathUtils.randFloatSpread(900),
                    THREE.MathUtils.randFloatSpread(800)
                );

                cloud.scale.setScalar(
                    Math.random()*3+1
                );

                group.add(cloud);

            }

            this.universe.add(group);

            this.worldObjects.push({
                object:group,
                type:"nebula",
                speed:
                    Math.random()*.0005+
                    .0002
            });

        }

    }

    /* =====================================================
       WORLD LANDMARKS
    ===================================================== */

    createWorlds(){

        this.createOriginWorld();

        this.createIdentityWorld();

        this.createSkillWorld();

        this.createTechWorld();

        this.createProjectWorld();

        this.createFantovexWorld();

        this.createFutureWorld();

    }

    /* =====================================================
       ORIGIN
    ===================================================== */

    createOriginWorld(){

        const group=new THREE.Group();

        group.position.z=1800;

        this.createHologramText(
            "SUBHASH",
            group,
            0,180,0,
            0x00ffaa,
            1100
        );

        this.createRingSystem(
            group,
            0,0,0,
            420,
            0x00ffaa
        );

        for(let i=0;i<8;i++){

            const orb=
                this.createWireOrb(
                    25,
                    0x00ffaa
                );

            const angle=
                i/8*Math.PI*2;

            orb.position.set(
                Math.cos(angle)*650,
                Math.sin(angle)*650,
                0
            );

            group.add(orb);

        }

        this.universe.add(group);

        this.worldObjects.push({
            object:group,
            type:"origin",
            speed:.001
        });

    }

    /* =====================================================
       IDENTITY
    ===================================================== */

    createIdentityWorld(){

        const group=new THREE.Group();

        group.position.z=-500;

        this.createHologramText(
            "DIGITAL MANAGER",
            group,
            0,180,0,
            0x00ffaa,
            650
        );

        this.createHologramText(
            "STRATEGY  •  TECH  •  EXECUTION",
            group,
            0,-30,0,
            0xffffff,
            250
        );

        const core=
            this.createCoreSphere(
                260
            );

        core.position.y=-430;

        group.add(core);

        this.universe.add(group);

        this.worldObjects.push({
            object:group,
            type:"identity",
            speed:.002
        });

    }

    /* =====================================================
       SKILLS
    ===================================================== */

    createSkillWorld(){

        const group=new THREE.Group();

        group.position.z=-3500;

        this.createHologramText(
            "SKILLS",
            group,
            0,450,0,
            0x00ffaa,
            850
        );

        const skills=[
            "WEB",
            "AI",
            "UI",
            "AUTOMATION",
            "DESIGN",
            "STRATEGY"
        ];

        skills.forEach((name,i)=>{

            const angle=
                i/skills.length*
                Math.PI*2;

            const radius=850;

            const node=
                this.createWireOrb(
                    100,
                    i%2
                    ?0x00f0ff
                    :0x00ffaa
                );

            node.position.set(
                Math.cos(angle)*radius,
                Math.sin(angle)*radius,
                Math.sin(angle*2)*250
            );

            group.add(node);

            this.createHologramText(
                name,
                node,
                0,-180,0,
                0xffffff,
                170
            );

        });

        this.createRingSystem(
            group,
            0,0,0,
            850,
            0x00ffaa
        );

        this.universe.add(group);

        this.worldObjects.push({
            object:group,
            type:"skills",
            speed:.003
        });

    }

    /* =====================================================
       TECHNOLOGY
    ===================================================== */

    createTechWorld(){

        const group=new THREE.Group();

        group.position.z=-7000;

        this.createHologramText(
            "TECH CONSTELLATION",
            group,
            0,400,0,
            0x00ffaa,
            700
        );

        const nodes=[];

        for(let i=0;i<16;i++){

            const node=
                this.createWireOrb(
                    45,
                    0x00f0ff
                );

            node.position.set(
                THREE.MathUtils.randFloatSpread(1800),
                THREE.MathUtils.randFloatSpread(1100),
                THREE.MathUtils.randFloatSpread(900)
            );

            nodes.push(node);

            group.add(node);

        }

        for(let i=0;i<nodes.length-1;i++){

            const points=[
                nodes[i].position,
                nodes[i+1].position
            ];

            const geo=
                new THREE.BufferGeometry()
                .setFromPoints(points);

            const line=
                new THREE.Line(
                    geo,
                    new THREE.LineBasicMaterial({
                        color:0x00ffaa,
                        transparent:true,
                        opacity:.25
                    })
                );

            group.add(line);

        }

        this.universe.add(group);

        this.worldObjects.push({
            object:group,
            type:"tech",
            speed:.002
        });

    }

    /* =====================================================
       PROJECTS
    ===================================================== */

    createProjectWorld(){

        const group=new THREE.Group();

        group.position.z=-10500;

        this.createHologramText(
            "PROJECT WORLDS",
            group,
            0,500,0,
            0xffffff,
            800
        );

        const projects=[
            ["NEXORA",0x00ffaa],
            ["FANTOVEX",0x00ffaa],
            ["VOLTRIX",0x00f0ff],
            ["WEB LAB",0xffffff]
        ];

        projects.forEach((project,i)=>{

            const angle=
                i/4*Math.PI*2;

            const radius=900;

            const planet=
                this.createPlanet(
                    160,
                    project[1]
                );

            planet.position.set(
                Math.cos(angle)*radius,
                Math.sin(angle)*radius,
                Math.sin(angle)*350
            );

            group.add(planet);

            this.createHologramText(
                project[0],
                planet,
                0,-280,0,
                project[1],
                190
            );

        });

        this.universe.add(group);

        this.worldObjects.push({
            object:group,
            type:"projects",
            speed:.003
        });

    }

    /* =====================================================
       FANTOVEX
    ===================================================== */

    createFantovexWorld(){

        const group=new THREE.Group();

        group.position.z=-14000;

        this.createHologramText(
            "FANTOVEX",
            group,
            0,500,0,
            0x00ffaa,
            1200
        );

        this.createHologramText(
            "PLAY BEYOND LIMITS",
            group,
            0,170,0,
            0x88ffdd,
            280
        );

        const portal=
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    700,
                    18,
                    24,
                    160
                ),

                new THREE.MeshBasicMaterial({
                    color:0x00ffaa,
                    wireframe:true,
                    transparent:true,
                    opacity:.7
                })

            );

        group.add(portal);

        const core=
            this.createCoreSphere(
                230
            );

        group.add(core);

        for(let i=0;i<30;i++){

            const shard=
                new THREE.Mesh(

                    new THREE.TetrahedronGeometry(
                        THREE.MathUtils.randFloat(20,70)
                    ),

                    new THREE.MeshBasicMaterial({
                        color:0x00ffaa,
                        wireframe:true,
                        transparent:true,
                        opacity:.45
                    })

                );

            const angle=
                Math.random()*Math.PI*2;

            const radius=
                850+
                Math.random()*600;

            shard.position.set(
                Math.cos(angle)*radius,
                Math.sin(angle)*radius,
                THREE.MathUtils.randFloatSpread(700)
            );

            group.add(shard);

        }

        this.universe.add(group);

        this.worldObjects.push({
            object:group,

        });

    }

    /* =====================================================
       FUTURE
    ===================================================== */

    createFutureWorld(){

        const group=new THREE.Group();

        group.position.z=-18000;

        this.createHologramText(
            "THE FUTURE",
            group,
            0,400,0,
            0x00ffaa,
            1100
        );

        this.createHologramText(
            "IS STILL LOADING...",
            group,
            0,50,0,
            0xffffff,
            300
        );

        this.createRingSystem(
            group,
            0,-300,0,
            850,
            0x00f0ff
        );

        this.universe.add(group);

        this.worldObjects.push({
            object:group,
            type:"future",
            speed:.004
        });

    }

    /* =====================================================
       HOLOGRAM TEXT
    ===================================================== */

    createHologramText(
        text,
        parent,
        x,y,z,
        color,
        width
    ){

        const canvas=
            document.createElement("canvas");

        canvas.width=2048;
        canvas.height=512;

        const ctx=
            canvas.getContext("2d");

        ctx.clearRect(
            0,0,
            canvas.width,
            canvas.height
        );

        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.font=
            "900 180px Arial";

        const hex=
            "#"+
            color.toString(16)
            .padStart(6,"0");

        ctx.shadowColor=hex;
        ctx.shadowBlur=40;

        ctx.fillStyle="#ffffff";

        ctx.fillText(
            text,
            1024,
            256
        );

        ctx.shadowBlur=100;

        ctx.fillStyle=hex;

        ctx.fillText(
            text,
            1024,
            256
        );

        const texture=
            new THREE.CanvasTexture(
                canvas
            );

        texture.minFilter=
            THREE.LinearFilter;

        const material=
            new THREE.SpriteMaterial({
                map:texture,
                transparent:true,
                depthWrite:false,
                blending:
                    THREE.AdditiveBlending
            });

        const sprite=
            new THREE.Sprite(material);

        sprite.position.set(
            x,y,z
        );

        sprite.scale.set(
            width,
            width*.25,
            1
        );

        parent.add(sprite);

        return sprite;

    }

    /* =====================================================
       RINGS
    ===================================================== */

    createRingSystem(
        parent,
        x,y,z,
        radius,
        color
    ){

        for(let i=0;i<4;i++){

            const ring=
                new THREE.Mesh(

                    new THREE.TorusGeometry(
                        radius+i*80,
                        5,
                        16,
                        128
                    ),

                    new THREE.MeshBasicMaterial({
                        color,
                        transparent:true,
                        opacity:
                            .35-i*.05,
                        wireframe:i%2===0,
                        blending:
                            THREE.AdditiveBlending
                    })

                );

            ring.position.set(
                x,y,z
            );

            ring.rotation.x=
                Math.PI/2+
                i*.18;

            ring.rotation.y=
                i*.2;

            parent.add(ring);

        }

    }

    /* =====================================================
       OBJECT HELPERS
    ===================================================== */

    createWireOrb(
        radius,
        color
    ){

        return new THREE.Mesh(

            new THREE.IcosahedronGeometry(
                radius,
                2
            ),

            new THREE.MeshBasicMaterial({
                color,
                wireframe:true,
                transparent:true,
                opacity:.65
            })

        );

    }

    createPlanet(
        radius,
        color
    ){

        const group=
            new THREE.Group();

        const body=
            new THREE.Mesh(

                new THREE.IcosahedronGeometry(
                    radius,
                    3
                ),

                new THREE.MeshBasicMaterial({
                    color,
                    wireframe:true,
                    transparent:true,
                    opacity:.65
                })

            );

        group.add(body);

        const ring=
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    radius*1.5,
                    3,
                    12,
                    80
                ),

                new THREE.MeshBasicMaterial({
                    color,
                    transparent:true,
                    opacity:.45
                })

            );

        ring.rotation.x=.8;

        group.add(ring);

        return group;

    }

    createCoreSphere(radius){

        const group=
            new THREE.Group();

        const sphere=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    radius,
                    32,
                    32
                ),

                new THREE.MeshBasicMaterial({
                    color:0x00ffaa,
                    transparent:true,
                    opacity:.12
                })

            );

        group.add(sphere);

        const ring=
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    radius*1.5,
                    5,
                    16,
                    100
                ),

                new THREE.MeshBasicMaterial({
                    color:0x00ffaa,
                    wireframe:true,
                    transparent:true,
                    opacity:.6
                })

            );

        group.add(ring);

        return group;

    }

    /* =====================================================
       WARP TUNNEL
    ===================================================== */

    createWarpTunnel(){

        this.warpLines=[];

        for(let i=0;i<250;i++){

            const geometry=
                new THREE.BufferGeometry();

            const length=
                THREE.MathUtils.randFloat(
                    100,
                    900
                );

            const angle=
                Math.random()*Math.PI*2;

            const radius=
                Math.random()*2500+
                300;

            const x=
                Math.cos(angle)*radius;

            const y=
                Math.sin(angle)*radius;

            const positions=
                new Float32Array([
                    x,y,0,
                    x,y,-length
                ]);

            geometry.setAttribute(
                "position",
                new THREE.BufferAttribute(
                    positions,
                    3
                )
            );

            const line=
                new THREE.Line(

                    geometry,

                    new THREE.LineBasicMaterial({
                        color:
                            Math.random()>.4
                            ?0x00ffaa
                            :0x00f0ff,

                        transparent:true,

                        opacity:
                            Math.random()*.3+.05,

                        blending:
                            THREE.AdditiveBlending
                    })

                );

            line.position.z=
                THREE.MathUtils.randFloat(
                    -20000,
                    2500
                );

            this.universe.add(line);

            this.warpLines.push(line);

        }

    }

    /* =====================================================
       INTERACTIVE CENTER
    ===================================================== */

    createInteractiveCore(){

        this.coreGroup=
            new THREE.Group();

        this.coreGroup.position.z=
            -500;

        for(let i=0;i<12;i++){

            const ring=
                new THREE.Mesh(

                    new THREE.TorusGeometry(
                        250+i*40,
                        2,
                        8,
                        80
                    ),

                    new THREE.MeshBasicMaterial({
                        color:
                            i%2
                            ?0x00ffaa
                            :0x00f0ff,

                        transparent:true,

                        opacity:.3,

                        blending:
                            THREE.AdditiveBlending
                    })

                );

            ring.rotation.x=
                Math.random()*Math.PI;

            ring.rotation.y=
                Math.random()*Math.PI;

            this.coreGroup.add(
                ring
            );

        }

        this.universe.add(
            this.coreGroup
        );

    }

    /* =====================================================
       INPUT
    ===================================================== */

    bindEvents(){

        addEventListener(
            "resize",
            ()=>{
                this.camera.aspect=
                    innerWidth/innerHeight;

                this.camera.updateProjectionMatrix();

                this.renderer.setSize(
                    innerWidth,
                    innerHeight
                );
            }
        );

        /* Mouse */

        addEventListener(
            "mousemove",
            e=>{

                this.mouse.tx=
                    (e.clientX/innerWidth-.5)*2;

                this.mouse.ty=
                    (e.clientY/innerHeight-.5)*2;

            }
        );

        /* Scroll */

        addEventListener(
            "wheel",
            e=>{

                this.targetZ-=
                    e.deltaY*3.5;

                this.targetZ=
                    THREE.MathUtils.clamp(
                        this.targetZ,
                        -19500,
                        2200
                    );

            },
            {passive:true}
        );

        /* Touch */

        let lastY=0;
        let lastX=0;

        addEventListener(
            "touchstart",
            e=>{

                lastY=
                    e.touches[0].clientY;

                lastX=
                    e.touches[0].clientX;

            },
            {passive:true}
        );

        addEventListener(
            "touchmove",
            e=>{

                const touch=
                    e.touches[0];

                const dy=
                    lastY-touch.clientY;

                const dx=
                    lastX-touch.clientX;

                lastY=
                    touch.clientY;

                lastX=
                    touch.clientX;

                this.targetZ-=
                    dy*7;

                this.targetZ=
                    THREE.MathUtils.clamp(
                        this.targetZ,
                        -19500,
                        2200
                    );

                this.mouse.tx=
                    THREE.MathUtils.clamp(
                        this.mouse.tx+
                        dx*.003,
                        -1,
                        1
                    );

            },
            {passive:true}
        );

        /* Navigation */

        document
            .querySelectorAll(".navItem")
            .forEach(item=>{

                item.addEventListener(
                    "click",
                    ()=>{

                        const index=
                            Number(
                                item.dataset.index
                            );

                        this.travelTo(
                            this.sections[index].z
                        );

                    }
                );

            });

        /* Enter */

        document
            .getElementById("enter")
            .addEventListener(
                "click",
                ()=>{

                    document
                        .getElementById("intro")
                        .classList.add("hide");

                    this.flashWarp();

                }
            );

    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    travelTo(z){

        this.targetZ=z;

        this.flashWarp();

    }

    flashWarp(){

        const flash=
            document.getElementById(
                "warpFlash"
            );

        flash.animate(
            [
                {opacity:0},
                {opacity:.8},
                {opacity:0}
            ],
            {
                duration:900,
                easing:"ease-out"
            }
        );

    }

    /* =====================================================
       SECTION DETECTION
    ===================================================== */

    updateSection(){

        let nearest=0;

        let distance=Infinity;

        this.sections.forEach(
            (section,i)=>{

                const d=
                    Math.abs(
                        this.z-section.z
                    );

                if(d<distance){

                    distance=d;
                    nearest=i;

                }

            }
        );

        document
            .querySelectorAll(".navItem")
            .forEach(
                (item,i)=>{
                    item.classList.toggle(
                        "active",
                        i===nearest
                    );
                }
            );

        const section=
            this.sections[nearest];

        const info=
            document.getElementById(
                "sectionInfo"
            );

        if(distance<1300){

            info.classList.add(
                "visible"
            );

            document.getElementById(
                "sectionEyebrow"
            ).textContent=
                section.eyebrow;

            document.getElementById(
                "sectionTitle"
            ).textContent=
                section.title;

            document.getElementById(
                "sectionDescription"
            ).textContent=
                section.description;

        }else{

            info.classList.remove(
                "visible"
            );

        }

    }

    /* =====================================================
       ANIMATION
    ===================================================== */

    animate(){

        requestAnimationFrame(
            ()=>this.animate()
        );

        const delta=
            this.clock.getDelta();

        const time=
            this.clock.getElapsedTime();

        /* -------------------------
           CAMERA INERTIA
        ------------------------- */

        const previousZ=
            this.z;

        this.z+=
            (this.targetZ-this.z)*
            .045;

        this.velocity=
            this.z-previousZ;

        /* -------------------------
           MOUSE SMOOTHING
        ------------------------- */

        this.mouse.x+=
            (this.mouse.tx-this.mouse.x)*
            .055;

        this.mouse.y+=
            (this.mouse.ty-this.mouse.y)*
            .055;

        /* -------------------------
           CAMERA POSITION
        ------------------------- */

        const swayX=
            Math.sin(time*.55)*12;

        const swayY=
            Math.cos(time*.7)*10;

        this.camera.position.x=
            swayX+
            this.mouse.x*260;

        this.camera.position.y=
            swayY-
            this.mouse.y*180;

        this.camera.position.z=
            this.z;

        /* -------------------------
           TRUE 3D LOOK
        ------------------------- */

        this.camera.rotation.x=
            -this.mouse.y*.28;

        this.camera.rotation.y=
            -this.mouse.x*.38;

        this.roll+=
            (-this.mouse.x*.12-
            this.roll)*.05;

        this.camera.rotation.z=
            this.roll;

        /* -------------------------
           DYNAMIC FOV
        ------------------------- */

        const speed=
            Math.min(
                1,
                Math.abs(this.velocity)/25
            );

        this.camera.fov=
            68+
            speed*28;

        this.camera.updateProjectionMatrix();

        /* -------------------------
           GALAXY
        ------------------------- */

        if(this.galaxy){

            this.galaxy.rotation.y=
                time*.012;

            this.galaxy.rotation.z=
                time*.008;

        }

        /* -------------------------
           STAR MOVEMENT
        ------------------------- */

        if(this.starField){

            this.starField.rotation.y=
                time*.0008;

            this.starField.rotation.x=
                Math.sin(time*.1)*.01;

        }

        /* -------------------------
           WORLD OBJECTS
        ------------------------- */

        this.worldObjects.forEach(
            world=>{

                if(world.type!=="nebula"){

                    world.object.rotation.y+=
                        world.speed;

                    world.object.rotation.x+=
                        world.speed*.2;

                }else{

                    world.object.rotation.y+=
                        world.speed;

                }

            }
        );

        /* -------------------------
           CORE
        ------------------------- */

        if(this.coreGroup){

            this.coreGroup.rotation.x=
                time*.15;

            this.coreGroup.rotation.y=
                time*.22;

        }

        /* -------------------------
           WARP LINES
        ------------------------- */

        const warpStrength=
            Math.min(
                1,
                Math.abs(this.velocity)/18
            );

        this.warpLines.forEach(
            (line,i)=>{

                line.material.opacity=
                    .04+
                    warpStrength*.35;

                line.scale.z=
                    1+
                    warpStrength*3;

            }
        );

        /* -------------------------
           HUD
        ------------------------- */

        const telemetry=
            document.getElementById(
                "telemetry"
            );

        telemetry.innerHTML=`
            POS_Z: ${this.z.toFixed(1).padStart(7," ")}<br>
            VELOCITY: ${(Math.abs(this.velocity)*.04).toFixed(3)} LY/S<br>
            WARP: ${(warpStrength*100).toFixed(0)}%<br>
            DIMENSION: 05
        `;

        this.updateSection();

        /* -------------------------
           RETICLE
        ------------------------- */

        const reticle=
            document.getElementById(
                "reticle"
            );

        reticle.style.transform=
            `translate(-50%,-50%)
             translate(
                ${this.mouse.x*35}px,
                ${this.mouse.y*35}px
             )
             scale(${1+warpStrength*.7})`;

        /* -------------------------
           RENDER
        ------------------------- */

        this.renderer.render(
            this.scene,
            this.camera
        );

    }

}
